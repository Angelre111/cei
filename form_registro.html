<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Centro La Paragua</title>
    <!-- Enlace a Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuración de la fuente Inter y paleta de colores amigable -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-image: url(img/descarga\ \(1\)_upscayl_3x_digital-art-4x.png);
            background-size: cover;
            background-repeat: no-repeat;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

        }

        /* Colores personalizados del Home Page, ajustados a un estilo infantil */
        .color-paragua-primary {
            background-color: #EC4899;
            /* Rosa Coral/Fucsia (Infantil) */
        }

        .text-paragua-primary {
            color: #EC4899;
        }

        .color-paragua-secondary {
            background-color: #f59e0b;
            /* Amarillo sol (Acento) */
        }

        /* Estilo para inputs enfocados - Usando un verde suave/menta */
        .input-focus:focus {
            border-color: #10B981;
            /* Verde menta */
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.5);
            /* Sombra verde pastel */
            outline: none;
        }

        /* Estilos para el contenedor del formulario para asegurar legibilidad */
        .form-container {
            background-color: rgba(255, 255, 255, 0.9);
            /* Fondo blanco semitransparente */
            backdrop-filter: blur(5px);
            /* Efecto de desenfoque para el fondo detrás del formulario */
        }

        /* Cambios de restablecer.html */
        .valid { color: #10B981; }
        .invalid { color: #9CA3AF; }
        .valid i { color: #10B981; }
        .invalid i { color: #D1D5DB; }

        .requirement-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }
    </style>
    <!-- Iconos Phosphor Icons -->
    <script src="https://unpkg.com/phosphor-icons"></script>
</head>

<body class="antialiased">

    <!-- Contenedor Central del Formulario -->
    <div
        class="form-container max-w-lg w-full rounded-3xl p-8 sm:p-10 shadow-2xl transition-all duration-500 transform hover:shadow-3xl">

        <!-- Encabezado y Logo -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center space-x-2 text-3xl font-extrabold text-gray-800 mb-2 mr-12">
                <img src="img/cei.png" width="80" height="80" viewBox="0 0 24 24" fill="none">
                <span>La Paragua</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mt-4">Crea tu Cuenta Padre/Representante!</h1>

            <!-- Mensaje Personalizado -->
            <p class="text-lg text-pink-600 mt-2 font-semibold flex items-center justify-center">
                <i class="ph-star-fill text-xl mr-2"></i> ¡Bienvenido! Regístrate para iniciar el proceso de
                Preinscripción.
            </p>
        </div>



        <!-- Formulario de Registro -->
        <form id="register-form" class="space-y-4" novalidate>

            <!-- Campo Nombres y Apellidos -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="nombres" class="block text-sm font-medium text-gray-700 mb-1">Nombres</label>
                    <div class="relative">
                        <i class="ph-user-circle text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                        <input type="text" id="nombres" name="nombres" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                            placeholder="Ej: Ana María">
                    </div>
                </div>
                <div>
                    <label for="apellidos" class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
                    <div class="relative">
                        <i class="ph-user-circle text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                        <input type="text" id="apellidos" name="apellidos" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                            placeholder="Ej: Rodríguez">
                    </div>
                </div>
            </div>

            <!-- Campo Correo Electrónico -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                <div class="relative">
                    <i class="ph-envelope text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="email" id="email" name="email" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                        placeholder="ejemplo@correo.com">
                </div>
            </div>

            <!-- Campo Teléfono -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Número de Teléfono</label>
                <div class="relative">
                    <i class="ph-phone text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="tel" id="phone" name="phone" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                        placeholder="Ej: 0412-1234567">
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <div class="relative">
                    <i class="ph-lock-key text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="password" id="password" name="password" required
                        class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-xl input-focus transition duration-200 text-sm"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassword('password', 'eye-icon-1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-pink-500 transition-colors">
                        <i id="eye-icon-1" class="ph-eye text-lg"></i>
                    </button>
                </div>
                
                <!-- Lista de Requisitos de Contraseña -->
                <div class="mt-3 grid grid-cols-2 gap-2 bg-white/50 p-3 rounded-2xl border border-gray-100">
                    <div id="req-length" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Mín. 8 caracteres</span>
                    </div>
                    <div id="req-upper" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Una mayúscula</span>
                    </div>
                    <div id="req-number" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Un número</span>
                    </div>
                    <div id="req-symbol" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Un símbolo (!@#...)</span>
                    </div>
                </div>
            </div>

            <!-- Campo Confirmar Contraseña -->
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar
                    Contraseña</label>
                <div class="relative">
                    <i class="ph-shield-check text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="password" id="confirm-password" name="confirm-password" required
                        class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassword('confirm-password', 'eye-icon-2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-pink-500 transition-colors">
                        <i id="eye-icon-2" class="ph-eye text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Aceptación de Términos -->
            <div class="flex items-start">
                <input id="terms" name="terms" type="checkbox" required
                    class="h-4 w-4 mt-1 text-pink-600 border-gray-300 rounded focus:ring-pink-500">
                <label for="terms" class="ml-2 block text-sm text-gray-900">
                    Acepto los <a href="#"
                        class="font-medium text-pink-600 hover:text-pink-800 transition duration-200">Términos y
                        Condiciones</a>
                </label>
            </div>

            <!-- Botón de Registro -->
            <div>
                <button type="submit" id="btn-submit"
                    class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-lg font-semibold text-white color-paragua-primary hover:bg-pink-600 transition duration-300 transform hover:scale-[1.01] opacity-50 cursor-not-allowed" disabled>
                    <i class="ph-user-plus mr-2 text-xl"></i> Registrarme
                </button>
            </div>
        </form>

        <!-- Enlace a Login -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                ¿Ya tienes cuenta?
                <a href="login.html" class="font-medium text-pink-600 hover:text-pink-800 transition duration-200">
                    Inicia Sesión aquí
                </a>
            </p>
        </div>
    </div>

    <!-- JavaScript para Simular el Registro -->

    <!-- SweetAlert2 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/validar_form_regis.js"></script>


    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm-password');
        const btnSubmit = document.getElementById('btn-submit');

        const requirements = {
            length: { re: /.{8,}/, el: document.getElementById('req-length') },
            upper: { re: /[A-Z]/, el: document.getElementById('req-upper') },
            number: { re: /[0-9]/, el: document.getElementById('req-number') },
            symbol: { re: /[^A-Za-z0-9]/, el: document.getElementById('req-symbol') }
        };

        function validatePassword() {
            const val = passwordInput.value;
            let allValid = true;

            for (const key in requirements) {
                const isValid = requirements[key].re.test(val);
                const el = requirements[key].el;
                const icon = el.querySelector('i');

                if (isValid) {
                    el.classList.remove('invalid');
                    el.classList.add('valid');
                    icon.classList.replace('ph-circle', 'ph-check-circle');
                } else {
                    el.classList.remove('valid');
                    el.classList.add('invalid');
                    icon.classList.replace('ph-check-circle', 'ph-circle');
                    allValid = false;
                }
            }

            // Validar si coinciden y términos aceptados
            const termsChecked = document.getElementById('terms').checked;
            const match = val === confirmInput.value && val !== '';
            
            if (allValid && match && termsChecked) {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnSubmit.disabled = true;
                btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        if (passwordInput && confirmInput) {
            passwordInput.addEventListener('input', validatePassword);
            confirmInput.addEventListener('input', validatePassword);
            const termsEl = document.getElementById('terms');
            if (termsEl) termsEl.addEventListener('change', validatePassword);
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }
    </script>
</body>

</html>
