  <style>
    body {

      overflow-x: auto;
    }
    .page {
      position: relative;
      width: 1500px;
      margin: 0 auto;
      background: #fff;
      border: 2px solid #888;
      box-shadow: 5px 5px 18px rgba(0,0,0,.30);
    }
    .page-title {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #1F3864;
      padding: 10px 0 4px;
      letter-spacing: .5px;
      border-bottom: 1px solid #ccc;
    }
    .badge {
      position: absolute; top: 0; right: 0;
      border-left: 2px solid #888; border-bottom: 2px solid #888;
      padding: 4px 14px; font-size: 13px; font-weight: 700;
      color: #333; background: #fff; z-index: 2;
    }
    .footer-bar {
      border-top: 2px solid #888;
      padding: 5px 18px; font-size: 13px; color: #444;
    }
    svg { display: block; }
  </style>
</head>

      /* Class name text */
      .cn  { font:bold italic 10.5px Arial; fill:#1F3864;
             text-anchor:middle; dominant-baseline:middle; }
      /* Attribute text */
      .ca  { font:9.5px Arial; fill:#333; }
      /* Relationship line (directed) */
      .rl  { stroke:#2E75B6; stroke-width:1.4; fill:none;
             marker-end:url(#arr); }
      /* Many-to-many line (bidirectional, no arrow) */
      .mm  { stroke:#2E75B6; stroke-width:1.4; fill:none;
             stroke-dasharray:6,3; }
      /* Multiplicity label */
      .mt  { font:bold 8.5px Arial; fill:#1F3864; }
      /* Edge label */
      .el  { font:italic 8px Arial; fill:#555; }
    </style>
