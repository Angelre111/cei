/* ═══════════════════════════════════════════════════════
   DIBUJO DE UN ELEMENTO
   ═══════════════════════════════════════════════════════ */
function drawEl(e){
  ctx.save();
  if(e===dragEl){ ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=12; }

  if(e.type==='entity'){
    ctx.fillStyle=ENT_F; ctx.strokeStyle=ENT_S; ctx.lineWidth=2;
    ctx.fillRect(e.cx-e.w/2,e.cy-e.h/2,e.w,e.h);
    ctx.strokeRect(e.cx-e.w/2,e.cy-e.h/2,e.w,e.h);
    ctx.fillStyle=ENT_T; ctx.font='bold 11px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(e.name,e.cx,e.cy);

  } else if(e.type==='diamond'){
    ctx.beginPath();
    ctx.moveTo(e.cx,e.cy-e.hh); ctx.lineTo(e.cx+e.hw,e.cy);
    ctx.lineTo(e.cx,e.cy+e.hh); ctx.lineTo(e.cx-e.hw,e.cy);
    ctx.closePath();
    ctx.fillStyle  = e.rel==='a'?ASS_F : e.rel==='m'?MN_F : REL_F;
    ctx.strokeStyle= e.rel==='m'?ENT_S : REL_S;
    ctx.lineWidth=2; ctx.fill(); ctx.stroke();
    ctx.fillStyle  = e.rel==='m'?MN_T : REL_T;
    ctx.font='bold 9px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    e.name.split('|').forEach((l,i,a)=>ctx.fillText(l,e.cx,e.cy+(i-(a.length-1)/2)*11));

  } else if(e.type==='oval'){
    ctx.beginPath(); ctx.ellipse(e.cx,e.cy,e.rx,e.ry,0,0,Math.PI*2);
    ctx.fillStyle=e.pk?PK_F:ATR_F; ctx.fill();
    ctx.strokeStyle=e.pk?PK_S:ATR_S; ctx.lineWidth=e.pk?1.6:1.4; ctx.stroke();
    ctx.fillStyle=e.pk?PK_T:ATR_T;
    ctx.font=(e.pk?'bold ':'' )+'9px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(e.name,e.cx,e.cy);
    if(e.pk){
      const tw=ctx.measureText(e.name).width;
      ctx.beginPath(); ctx.moveTo(e.cx-tw/2,e.cy+5); ctx.lineTo(e.cx+tw/2,e.cy+5);
      ctx.strokeStyle=PK_T; ctx.lineWidth=1; ctx.stroke();
    }

  } else if(e.type==='card'){
    ctx.fillStyle=CARD; ctx.font='bold 11px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(e.text,e.cx,e.cy);
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════

      const tw=ctx.measureText('id').width;

      ctx.strokeStyle=PK_T; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='#333'; ctx.font='8px Arial'; ctx.textAlign='left';
      ctx.fillText('Atrib. clave (PK)',lx+80,ly+114);
    },
  ];
  rows.forEach(f=>f());
  [['REL.',lx+48,ly+152,REL_F,REL_S,REL_T,'Relación 1:N o 1:1'],
   ['REL.',lx+48,ly+192,ASS_F,REL_S,REL_T,'Relación N:M (con atribs.)'],
   ['REL.',lx+48,ly+232,MN_F, ENT_S,MN_T, 'Relación N:M pura'],
  ].forEach(([nm,cx,cy,ff,ss,tt,label])=>{
    ctx.beginPath();
    ctx.moveTo(cx,cy-22); ctx.lineTo(cx+42,cy); ctx.lineTo(cx,cy+22); ctx.lineTo(cx-42,cy);
    ctx.closePath();
    ctx.fillStyle=ff; ctx.fill(); ctx.strokeStyle=ss; ctx.lineWidth=2; ctx.stroke();

}

/* ═══════════════════════════════════════════════════════
   RENDER PRINCIPAL
   ═══════════════════════════════════════════════════════ */
function render(){
  ctx.clearRect(0,0,cv.width,cv.height);

  /* 1. Líneas (debajo de todo) */
  ctx.strokeStyle=LN; ctx.lineWidth=1.3;
  CN.forEach(({a,b})=>{
    const ea=byId(a), eb=byId(b);
    if(!ea||!eb) return;
    ctx.beginPath(); ctx.moveTo(ea.cx,ea.cy); ctx.lineTo(eb.cx,eb.cy); ctx.stroke();
  });

  /* 2. Formas por capa: rombos → entidades → óvalos → etiquetas */
  ['diamond','entity','oval','card'].forEach(t=>EL.filter(e=>e.type===t).forEach(drawEl));

  /* 3. Leyenda fija */
  drawLegend();
}

/* ═══════════════════════════════════════════════════════
   HIT TESTING
   ═══════════════════════════════════════════════════════ */
function hit(e,mx,my){
  const dx=mx-e.cx, dy=my-e.cy;
  if(e.type==='entity')  return Math.abs(dx)<=e.w/2 && Math.abs(dy)<=e.h/2;
  if(e.type==='diamond') return Math.abs(dx)/e.hw + Math.abs(dy)/e.hh <= 1.05;
  if(e.type==='oval')    return (dx/e.rx)**2+(dy/e.ry)**2 <= 1.1;
  if(e.type==='card')    return Math.abs(dx)<=14 && Math.abs(dy)<=12;
  return false;
}

/* ═══════════════════════════════════════════════════════
   DRAG & DROP
   ═══════════════════════════════════════════════════════ */
let dragEl=null, dragOx=0, dragOy=0;

function canvasPos(evt){
  const r=cv.getBoundingClientRect();
  const sx=cv.width/r.width, sy=cv.height/r.height;
  const src=evt.touches ? evt.touches[0] : evt;
  return { x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy };
}

function onDown(evt){
  evt.preventDefault();
  const {x,y}=canvasPos(evt);
  // Prioridad: card → oval → entity → diamond
  for(const type of ['card','oval','entity','diamond']){
    const found=[...EL].filter(e=>e.type===type).reverse().find(e=>hit(e,x,y));
    if(found){ dragEl=found; dragOx=x-found.cx; dragOy=y-found.cy;
               cv.style.cursor='grabbing'; return; }
  }
}
function onMove(evt){
  evt.preventDefault();
  const {x,y}=canvasPos(evt);
  if(dragEl){
    dragEl.cx=x-dragOx; dragEl.cy=y-dragOy;
    render();
  } else {
    cv.style.cursor=EL.some(e=>hit(e,x,y))?'grab':'default';
  }
}
function onUp(){ dragEl=null; cv.style.cursor='default'; }

cv.addEventListener('mousedown',onDown);
cv.addEventListener('mousemove',onMove);
cv.addEventListener('mouseup',  onUp);
cv.addEventListener('mouseleave',onUp);
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove', onMove,{passive:false});
cv.addEventListener('touchend',  onUp);

/* Render inicial */
render();
</script>
</body>
</html>
