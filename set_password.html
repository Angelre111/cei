<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear contraseña - Centro La Paragua</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/phosphor-icons"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Supabase SDK (necesario para la lógica original) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tu archivo de configuración (debe contener SUPABASE_URL y SUPABASE_ANON_KEY, además de API_BASE_URL si se requiere) -->
    <script src="js/config.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-image: url('img/descarga (1)_upscayl_3x_digital-art-4x.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
        }

        /* Colores personalizados (igual que login.html) */
        .color-paragua-primary {
            background-color: #EC4899;
        }

        .text-paragua-primary {
            color: #EC4899;
        }

        .color-paragua-secondary {
            background-color: #f59e0b;
        }

        /* Estilo para inputs enfocados (verde menta) */
        .input-focus:focus {
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.5);
            outline: none;
        }

        /* Animación suave para la tarjeta */
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body class="antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-2xl card-hover transition-all duration-500">

        <!-- Encabezado con logo y título -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center space-x-2 text-3xl font-extrabold text-gray-800 mb-2">
                <img src="img/cei.png" alt="Logo CEI La Paragua" width="70" height="70" class="object-contain">
                <span class="text-2xl">La Paragua</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mt-4">¡Bienvenido al equipo!</h1>
            <p class="text-gray-500 mt-2">Establece tu contraseña segura para acceder al sistema.</p>
        </div>

        <!-- Formulario de creación de contraseña -->
        <form id="set-password-form" class="space-y-6">
            <!-- Campo nueva contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
                <div class="relative">
                    <i class="ph-lock-key text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="password" id="password" name="password" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                        placeholder="Mínimo 8 caracteres">
                </div>
                <p class="text-[11px] text-gray-500 mt-1.5 ml-1 flex items-center gap-1">
                    <i class="ph-info text-pink-500"></i>
                    Debe incluir una mayúscula, una minúscula, un número y un símbolo (Ej: @$!%*?&).
                </p>
            </div>

            <!-- Campo confirmar contraseña -->
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar
                    contraseña</label>
                <div class="relative">
                    <i class="ph-lock-key-open text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="password" id="confirm-password" name="confirm-password" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                        placeholder="Repite la contraseña">
                </div>
            </div>

            <!-- Botón de guardar -->
            <div>
                <button type="submit"
                    class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-lg font-semibold text-white color-paragua-primary hover:bg-pink-600 transition duration-300 transform hover:scale-[1.01]">
                    <i class="ph-floppy-disk mr-2 text-xl"></i> Guardar contraseña
                </button>
            </div>
        </form>

        <!-- Enlace opcional para volver al login -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                ¿Ya tienes cuenta?
                <a href="login.html" class="font-medium text-pink-600 hover:text-pink-800 transition duration-200">
                    Inicia sesión aquí
                </a>
            </p>
         <script>
        // ============================================
        // VERIFICACIÓN INMEDIATA Y PROTECCIÓN BF-CACHE
        // ============================================
        function verificarAccesoValido() {
            // 1. Si la contraseña ya fue establecida en esta sesión, bloquear retorno
            if (sessionStorage.getItem('password_set_success') === 'true') {
                window.location.replace('login.html');
                return false;
            }

            // 2. Verificar tokens en URL
            const hash = window.location.hash;
            const tieneToken = hash && hash.includes('access_token');
            const tieneError = hash && hash.includes('error=');

            if (!tieneToken || tieneError) {
                history.replaceState(null, '', 'login.html');
                window.location.replace('login.html');
                return false;
            }
            return true;
        }

        // Ejecutar inmediatamente
        verificarAccesoValido();

        // Controlar cuando el usuario usa el botón "Atrás" (BFCache)
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                verificarAccesoValido();
            }
        });

        // ============================================
        // INICIALIZAR SUPABASE
        // ============================================
        let supabaseClient = null;
        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.error("Error al inicializar Supabase:", err);
        }

        // ============================================
        // REGEX DE CONTRASEÑA — ampliado para aceptar más símbolos
        // Acepta: letras, números y símbolos comunes (@ $ ! % * ? & . - _ # + = )
        // ============================================
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&.\-_#+= ])[A-Za-z\d@$!%*?&.\-_#+= ]{8,}$/;

        // Elementos del DOM
        const form = document.getElementById('set-password-form');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm-password');
        const submitBtn = form.querySelector('button[type="submit"]');

        function mostrarError(titulo, mensaje) {
            Swal.fire({
                title: titulo,
                text: mensaje,
                icon: 'warning',
                confirmButtonColor: '#EC4899',
                customClass: { popup: 'rounded-2xl shadow-xl' }
            });
        }

        // Feedback visual en tiempo real
        passwordInput.addEventListener('input', function () {
            const valid = passwordRegex.test(this.value);
            this.classList.toggle('border-yellow-400', !valid && this.value.length > 0);
            this.classList.toggle('bg-yellow-50', !valid && this.value.length > 0);
            this.classList.toggle('border-green-400', valid);
        });

        confirmInput.addEventListener('input', function () {
            const noCoincide = this.value !== passwordInput.value && passwordInput.value.length > 0;
            this.classList.toggle('border-red-300', noCoincide);
            this.classList.toggle('bg-red-50', noCoincide);
            this.classList.toggle('border-green-400', !noCoincide && this.value.length > 0);
        });

        // ============================================
        // ENVÍO DEL FORMULARIO
        // ============================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value;
            const confirm = confirmInput.value;

            if (password !== confirm) {
                mostrarError('Las contraseñas no coinciden', 'Verifica que ambos campos sean iguales.');
                return;
            }

            if (!passwordRegex.test(password)) {
                mostrarError('Contraseña no segura',
                    'Debe tener al menos 8 caracteres, una mayúscula, una minúscula, un número y un símbolo (@$!%*?&.-_#+= ).');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
            submitBtn.innerHTML = '<i class="ph-spinner gap-2 animate-spin mr-2"></i> Estableciendo...';

            try {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');

                if (!supabaseClient) throw new Error('Cliente de Supabase no inicializado.');

                if (accessToken && refreshToken) {
                    const { error: sessionError } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    if (sessionError) throw sessionError;
                } else {
                    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                    if (sessionError || !session) {
                        throw new Error('No se pudo establecer la sesión. El enlace puede haber expirado.');
                    }
                }

                const { error: updateError } = await supabaseClient.auth.updateUser({ password });
                if (updateError) throw updateError;

                // ── Activar la cuenta en el sistema ──────────────────────────
                // Llamamos al backend ANTES del signOut (necesitamos token válido)
                try {
                    const { data: { session: sess } } = await supabaseClient.auth.getSession();
                    if (sess?.access_token) {
                        await fetch(`${API_BASE_URL}/api/activar_cuenta`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${sess.access_token}` }
                        });
                    }
                } catch (activarErr) {
                    console.warn('⚠️ No se pudo activar la cuenta en el backend:', activarErr);
                    // No bloqueamos el flujo — el admin puede activar manualmente
                }

                // Limpiar el hash de la URL para que no se reutilice el token
                history.replaceState(null, '', window.location.pathname);

                await supabaseClient.auth.signOut();

                // Marcar el éxito en la sesión actual
                sessionStorage.setItem('password_set_success', 'true');

                await Swal.fire({
                    title: '¡Contraseña creada!',
                    text: 'Tu cuenta ya está protegida. Ahora puedes iniciar sesión.',
                    icon: 'success',
                    confirmButtonColor: '#EC4899',
                    timer: 3000,
                    timerProgressBar: true,
                    showConfirmButton: true,
                    customClass: { popup: 'rounded-2xl shadow-2xl' }
                });

                // replace() para que Atrás no regrese a esta página
                window.location.replace('login.html');

            } catch (err) {
                console.error('Error en set_password:', err);
                let mensaje = err.message || 'No se pudo establecer la contraseña.';
                if (mensaje.includes('refresh_token_not_found') || mensaje.includes('otp_expired')) {
                    mensaje = 'El enlace ha expirado. Pide al administrador que reenvíe la invitación.';
                } else if (mensaje.includes('invalid token') || mensaje.includes('invalid_token')) {
                    mensaje = 'Token inválido. Usa el enlace más reciente que recibiste en tu correo.';
                }
                Swal.fire({
                    title: 'Error al crear contraseña',
                    text: mensaje,
                    icon: 'error',
                    confirmButtonColor: '#EC4899',
                    customClass: { popup: 'rounded-2xl' }
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                submitBtn.innerHTML = '<i class="ph-floppy-disk mr-2 text-xl"></i> Guardar contraseña';
            }
        });
    </script>
</body>

</html>
