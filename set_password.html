<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear contraseña - Centro La Paragua</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/phosphor-icons"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Supabase SDK (necesario para la lógica original) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tu archivo de configuración (debe contener SUPABASE_URL y SUPABASE_ANON_KEY, además de API_BASE_URL si se requiere) -->
    <script src="js/config.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-image: url('img/descarga (1)_upscayl_3x_digital-art-4x.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
        }

        /* Colores personalizados (igual que login.html) */
        .color-paragua-primary {
            background-color: #EC4899;
        }

        .text-paragua-primary {
            color: #EC4899;
        }

        .color-paragua-secondary {
            background-color: #f59e0b;
        }

        /* Estilo para inputs enfocados (verde menta) */
        .input-focus:focus {
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.5);
            outline: none;
        }

        /* Animación suave para la tarjeta */
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.25);
        }

        /* Cambios de restablecer.html */
        .valid { color: #10B981; }
        .invalid { color: #9CA3AF; }
        .valid i { color: #10B981; }
        .invalid i { color: #D1D5DB; }

        .requirement-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }
    </style>
</head>

<body class="antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-2xl card-hover transition-all duration-500">

        <!-- Encabezado con logo y título -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center space-x-2 text-3xl font-extrabold text-gray-800 mb-2">
                <img src="img/cei.png" alt="Logo CEI La Paragua" width="70" height="70" class="object-contain">
                <span class="text-2xl">La Paragua</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mt-4">¡Bienvenido al equipo!</h1>
            <p class="text-gray-500 mt-2">Establece tu contraseña segura para acceder al sistema.</p>
        </div>

        <!-- Formulario de creación de contraseña -->
        <form id="set-password-form" class="space-y-6">
            <!-- Campo nueva contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
                <div class="relative">
                    <i class="ph-lock-key text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="password" id="password" name="password" required
                        class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassword('password', 'eye-icon-1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-pink-500 transition-colors">
                        <i id="eye-icon-1" class="ph-eye text-lg"></i>
                    </button>
                </div>
                
                <!-- Lista de Requisitos de Contraseña -->
                <div class="mt-3 grid grid-cols-2 gap-2 bg-white/50 p-3 rounded-2xl border border-gray-100">
                    <div id="req-length" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Mín. 8 caracteres</span>
                    </div>
                    <div id="req-upper" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Una mayúscula</span>
                    </div>
                    <div id="req-number" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Un número</span>
                    </div>
                    <div id="req-symbol" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Un símbolo (!@#...)</span>
                    </div>
                </div>
            </div>

            <!-- Campo confirmar contraseña -->
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar
                    contraseña</label>
                <div class="relative">
                    <i class="ph-shield-check text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="password" id="confirm-password" name="confirm-password" required
                        class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassword('confirm-password', 'eye-icon-2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-pink-500 transition-colors">
                        <i id="eye-icon-2" class="ph-eye text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Botón de guardar -->
            <div>
                <button type="submit" id="btn-submit"
                    class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-lg font-semibold text-white color-paragua-primary hover:bg-pink-600 transition duration-300 transform hover:scale-[1.01] opacity-50 cursor-not-allowed" disabled>
                    <i class="ph-floppy-disk mr-2 text-xl"></i> Guardar contraseña
                </button>
            </div>
        </form>

        <!-- Enlace opcional para volver al login -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                ¿Ya tienes cuenta?
                <a href="login.html" class="font-medium text-pink-600 hover:text-pink-800 transition duration-200">
                    Inicia sesión aquí
                </a>
            </p>
         <script>
        // ============================================
        // VERIFICACIÓN INMEDIATA Y PROTECCIÓN BF-CACHE
        // ============================================
        function verificarAccesoValido() {
            // 1. Si la contraseña ya fue establecida en esta sesión, bloquear retorno
            if (sessionStorage.getItem('password_set_success') === 'true') {
                window.location.replace('login.html');
                return false;
            }

            // 2. Verificar tokens en URL
            const hash = window.location.hash;
            const tieneToken = hash && hash.includes('access_token');
            const tieneError = hash && hash.includes('error=');

            if (!tieneToken || tieneError) {
                history.replaceState(null, '', 'login.html');
                window.location.replace('login.html');
                return false;
            }
            return true;
        }

        // Ejecutar inmediatamente
        verificarAccesoValido();

        // Controlar cuando el usuario usa el botón "Atrás" (BFCache)
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                verificarAccesoValido();
            }
        });

        // ============================================
        // INICIALIZAR SUPABASE
        // ============================================
        let supabaseClient = null;
        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.error("Error al inicializar Supabase:", err);
        }

        // ============================================
        // REGEX DE CONTRASEÑA — ampliado para aceptar más símbolos
        // Acepta: letras, números y símbolos comunes (@ $ ! % * ? & . - _ # + = )
        // ============================================
        // Elementos del DOM
        const form = document.getElementById('set-password-form');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm-password');
        const submitBtn = document.getElementById('btn-submit');

        const requirements = {
            length: { re: /.{8,}/, el: document.getElementById('req-length') },
            upper: { re: /[A-Z]/, el: document.getElementById('req-upper') },
            number: { re: /[0-9]/, el: document.getElementById('req-number') },
            symbol: { re: /[^A-Za-z0-9]/, el: document.getElementById('req-symbol') }
        };

        function validatePassword() {
            const val = passwordInput.value;
            let allValid = true;

            for (const key in requirements) {
                const isValid = requirements[key].re.test(val);
                const el = requirements[key].el;
                const icon = el.querySelector('i');

                if (isValid) {
                    el.classList.remove('invalid');
                    el.classList.add('valid');
                    icon.classList.replace('ph-circle', 'ph-check-circle');
                } else {
                    el.classList.remove('valid');
                    el.classList.add('invalid');
                    icon.classList.replace('ph-check-circle', 'ph-circle');
                    allValid = false;
                }
            }

            const match = val === confirmInput.value && val !== '';
            
            if (allValid && match) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        passwordInput.addEventListener('input', validatePassword);
        confirmInput.addEventListener('input', validatePassword);

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }

        function mostrarError(titulo, mensaje) {
            Swal.fire({
                title: titulo,
                text: mensaje,
                icon: 'warning',
                confirmButtonColor: '#EC4899',
                customClass: { popup: 'rounded-2xl shadow-xl' }
            });
        }

        // ============================================
        // ENVÍO DEL FORMULARIO
        // ============================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value;
            const confirm = confirmInput.value;

            // La validación ahora se maneja en tiempo real, pero dejamos esto como fallback
            if (password !== confirm) {
                mostrarError('Las contraseñas no coinciden', 'Verifica que ambos campos sean iguales.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
            submitBtn.innerHTML = '<i class="ph-spinner gap-2 animate-spin mr-2"></i> Estableciendo...';

            try {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');

                if (!supabaseClient) throw new Error('Cliente de Supabase no inicializado.');

                if (accessToken && refreshToken) {
                    const { error: sessionError } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    if (sessionError) throw sessionError;
                } else {
                    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                    if (sessionError || !session) {
                        throw new Error('No se pudo establecer la sesión. El enlace puede haber expirado.');
                    }
                }

                const { error: updateError } = await supabaseClient.auth.updateUser({ password });
                if (updateError) throw updateError;

                // ── Activar la cuenta en el sistema y obtener datos del usuario ──
                // Llamamos al backend ANTES del signOut (necesitamos token válido)
                let rolUsuario = null;
                try {
                    const { data: { session: sess } } = await supabaseClient.auth.getSession();
                    if (sess?.access_token) {
                        // Activar cuenta
                        await fetch(`${API_BASE_URL}/api/activar_cuenta`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${sess.access_token}` }
                        });

                        // Obtener el rol del usuario para decidir la redirección
                        try {
                            const userInfoRes = await fetch(`${API_BASE_URL}/api/mi_perfil`, {
                                headers: { 'Authorization': `Bearer ${sess.access_token}` }
                            });
                            if (userInfoRes.ok) {
                                const userInfo = await userInfoRes.json();
                                rolUsuario = (userInfo.rol || '').toLowerCase();
                            }
                        } catch (rolErr) {
                            console.warn('⚠️ No se pudo obtener el rol del usuario:', rolErr);
                        }

                        // Si es admin o docente, guardar tokens para redirección directa a completar_perfil
                        if (rolUsuario === 'administrador' || rolUsuario === 'docente') {
                            localStorage.setItem('auth_token', sess.access_token);
                            localStorage.setItem('refresh_token', sess.refresh_token || '');
                            localStorage.setItem('user_rol', rolUsuario);
                            localStorage.setItem('user_id', sess.user?.id || '');
                            localStorage.setItem('user_email', sess.user?.email || '');
                            localStorage.setItem('perfil_completado', 'false');
                        }
                    }
                } catch (activarErr) {
                    console.warn('⚠️ No se pudo activar la cuenta en el backend:', activarErr);
                    // No bloqueamos el flujo — el admin puede activar manualmente
                }

                // Limpiar el hash de la URL para que no se reutilice el token
                history.replaceState(null, '', window.location.pathname);

                // Solo hacer signOut si NO vamos a redirigir con sesión activa
                if (rolUsuario !== 'administrador' && rolUsuario !== 'docente') {
                    await supabaseClient.auth.signOut();
                }

                // Marcar el éxito en la sesión actual
                sessionStorage.setItem('password_set_success', 'true');

                // ── Redirección según rol ──────────────────────────────────────
                if (rolUsuario === 'administrador' || rolUsuario === 'docente') {
                    await Swal.fire({
                        title: '¡Contraseña creada!',
                        text: 'Excelente. Ahora completa tu perfil profesional para activar tu cuenta.',
                        icon: 'success',
                        confirmButtonColor: '#EC4899',
                        timer: 3000,
                        timerProgressBar: true,
                        showConfirmButton: true,
                        customClass: { popup: 'rounded-2xl shadow-2xl' }
                    });
                    window.location.replace('completar_perfil.html');
                } else {
                    await Swal.fire({
                        title: '¡Contraseña creada!',
                        text: 'Tu cuenta ya está protegida. Ahora puedes iniciar sesión.',
                        icon: 'success',
                        confirmButtonColor: '#EC4899',
                        timer: 3000,
                        timerProgressBar: true,
                        showConfirmButton: true,
                        customClass: { popup: 'rounded-2xl shadow-2xl' }
                    });
                    // replace() para que Atrás no regrese a esta página
                    window.location.replace('login.html');
                }

            } catch (err) {
                console.error('Error en set_password:', err);
                let mensaje = err.message || 'No se pudo establecer la contraseña.';
                if (mensaje.includes('refresh_token_not_found') || mensaje.includes('otp_expired')) {
                    mensaje = 'El enlace ha expirado. Pide al administrador que reenvíe la invitación.';
                } else if (mensaje.includes('invalid token') || mensaje.includes('invalid_token')) {
                    mensaje = 'Token inválido. Usa el enlace más reciente que recibiste en tu correo.';
                }
                Swal.fire({
                    title: 'Error al crear contraseña',
                    text: mensaje,
                    icon: 'error',
                    confirmButtonColor: '#EC4899',
                    customClass: { popup: 'rounded-2xl' }
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                submitBtn.innerHTML = '<i class="ph-floppy-disk mr-2 text-xl"></i> Guardar contraseña';
            }
        });
    </script>
</body>

</html>
