<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Centro La Paragua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-image: url("img/descarga (1)_upscayl_3x_digital-art-4x.png");
            background-size: cover;
            background-repeat: no-repeat;
        }

        .valid { color: #10B981; }
        .invalid { color: #9CA3AF; }
        .valid i { color: #10B981; }
        .invalid i { color: #D1D5DB; }

        .requirement-item {
            display: flex;
            items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }

        /* Color Rosa Personalizado */
        .btn-pink {
            background-color: #EC4899;
        }
        .btn-pink:hover {
            background-color: #DB2777;
        }
    </style>
    <script src="https://unpkg.com/phosphor-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] p-8 sm:p-10 shadow-2xl">
        <div class="text-left mb-8">
            <h1 class="text-3xl font-black text-gray-900">Crea tu nueva clave</h1>
            <p class="text-gray-500 mt-2 text-sm font-medium">Por seguridad, elige una contraseña que no hayas usado antes en este portal.</p>
        </div>

        <form id="reset-form" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Nueva Contraseña</label>
                <div class="relative">
                    <i class="ph-lock-key text-gray-400 absolute left-4 top-1/2 -translate-y-1/2 text-xl"></i>
                    <input type="password" id="password" required
                        class="w-full pl-12 pr-12 py-4 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-pink-100 focus:border-pink-500 outline-none transition-all text-lg"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassword('password', 'eye-icon-1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-pink-500 transition-colors">
                        <i id="eye-icon-1" class="ph-eye text-xl"></i>
                    </button>
                </div>
                
                <!-- Lista de Requisitos de Contraseña -->
                <div class="mt-4 grid grid-cols-2 gap-2">
                    <div id="req-length" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Mín. 8 caracteres</span>
                    </div>
                    <div id="req-upper" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Una mayúscula</span>
                    </div>
                    <div id="req-number" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Un número</span>
                    </div>
                    <div id="req-symbol" class="requirement-item invalid">
                        <i class="ph-circle"></i> <span>Un símbolo (!@#...)</span>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Confirmar Contraseña</label>
                <div class="relative">
                    <i class="ph-shield-check text-gray-400 absolute left-4 top-1/2 -translate-y-1/2 text-xl"></i>
                    <input type="password" id="confirm-password" required
                        class="w-full pl-12 pr-12 py-4 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-pink-100 focus:border-pink-500 outline-none transition-all text-lg"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassword('confirm-password', 'eye-icon-2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-pink-500 transition-colors">
                        <i id="eye-icon-2" class="ph-eye text-xl"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full py-4 btn-pink text-white rounded-2xl font-black text-lg shadow-xl hover:shadow-pink-200/50 transition-all transform hover:-translate-y-1 flex justify-center items-center gap-2 opacity-50 cursor-not-allowed" disabled>
                Actualizar Contraseña
            </button>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm-password');
        const btnSubmit = document.getElementById('btn-submit');

        const requirements = {
            length: { re: /.{8,}/, el: document.getElementById('req-length') },
            upper: { re: /[A-Z]/, el: document.getElementById('req-upper') },
            number: { re: /[0-9]/, el: document.getElementById('req-number') },
            symbol: { re: /[^A-Za-z0-9]/, el: document.getElementById('req-symbol') }
        };

        function validatePassword() {
            const val = passwordInput.value;
            let allValid = true;

            for (const key in requirements) {
                const isValid = requirements[key].re.test(val);
                const el = requirements[key].el;
                const icon = el.querySelector('i');

                if (isValid) {
                    el.classList.remove('invalid');
                    el.classList.add('valid');
                    icon.classList.replace('ph-circle', 'ph-check-circle');
                } else {
                    el.classList.remove('valid');
                    el.classList.add('invalid');
                    icon.classList.replace('ph-check-circle', 'ph-circle');
                    allValid = false;
                }
            }

            // Validar si coinciden
            const match = val === confirmInput.value && val !== '';
            
            if (allValid && match) {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnSubmit.disabled = true;
                btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        passwordInput.addEventListener('input', validatePassword);
        confirmInput.addEventListener('input', validatePassword);

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }

        // LÓGICA DE RECUPERACIÓN
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            if (password !== confirm) {
                Swal.fire('¡Oops!', 'Las contraseñas no coinciden.', 'warning');
                return;
            }

            const hash = window.location.hash;
            const params = new URLSearchParams(hash.replace('#', '?'));
            const accessToken = params.get('access_token');

            if (!accessToken) {
                Swal.fire({
                    title: 'Enlace expirado',
                    text: 'El enlace de recuperación ya no es válido o ha expirado. Por favor, solicita uno nuevo.',
                    icon: 'error',
                    confirmButtonText: 'Ir al Login',
                    confirmButtonColor: '#EC4899'
                }).then(() => window.location.href = 'login.html');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="ph-spinner animate-spin"></i> Guardando...';

            try {
                const res = await fetch(`${API_BASE_URL}/api/usuarios/actualizar-password`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({ password: password })
                });

                if (res.ok) {
                    Swal.fire({
                        title: '¡Clave actualizada!',
                        text: 'Ya puedes iniciar sesión con tu nueva contraseña.',
                        icon: 'success',
                        confirmButtonColor: '#EC4899'
                    }).then(() => window.location.href = 'login.html');
                } else {
                    const data = await res.json();
                    Swal.fire('Error', data.message || 'No se pudo actualizar la clave.', 'error');
                }
            } catch (err) {
                Swal.fire('Error de Red', 'No se pudo conectar con el servidor.', 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Actualizar Contraseña';
                validatePassword();
            }
        });
    </script>
</body>
</html>
