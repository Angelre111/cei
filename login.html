<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Centro La Paragua</title>
    <!-- Enlace a Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuración de la fuente Inter y paleta de colores amigable -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-image: url(img/descarga\ \(1\)_upscayl_3x_digital-art-4x.png);
            background-size: cover;
            background-repeat: no-repeat;


        }

        /* Colores personalizados del Home Page, ajustados a un estilo infantil */
        .color-paragua-primary {
            background-color: #EC4899;
            /* Rosa Coral/Fucsia (Infantil) */
        }

        .text-paragua-primary {
            color: #EC4899;
        }

        .color-paragua-secondary {
            background-color: #f59e0b;
            /* Amarillo sol (Acento) */
        }

        /* Estilo para inputs enfocados - Usando un verde suave/menta */
        .input-focus:focus {
            border-color: #10B981;
            /* Verde menta */
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.5);
            /* Sombra verde pastel */
            outline: none;
        }
    </style>
    <!-- Iconos Phosphor Icons -->
    <script src="https://unpkg.com/phosphor-icons"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Central del Formulario -->
    <div
        class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-2xl transition-all duration-500 transform hover:shadow-3xl">

        <!-- Encabezado y Logo -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center space-x-2 text-3xl font-extrabold text-gray-800 mb-2 mr-12">
                <!-- CAMBIO: Icono en Amarillo Sol para un toque infantil -->
                <img src="img/cei.png" width="80" height="80" viewBox="0 0 24 24" fill="none">
                <span>La Paragua</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mt-4">Bienvenido de Nuevo</h1>
            <p class="text-gray-500 mt-2">Accede a la plataforma privada para padres y personal.</p>
        </div>

        <!-- Mensaje de Estado (Eliminado para usar SweetAlert) -->


        <!-- Formulario de Inicio de Sesión -->
        <form id="login-form" class="space-y-6">

            <!-- Campo Email/Usuario -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico /
                    Usuario</label>
                <div class="relative">
                    <i class="ph-envelope text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="text" id="email" name="email" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                        placeholder="ejemplo@laparagua.edu.ve">
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <div class="relative">
                    <i class="ph-lock-key text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="password" id="password" name="password" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl input-focus transition duration-200"
                        placeholder="••••••••">
                </div>
            </div>

            <!-- Recordarme y Olvidé Contraseña -->
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <!-- CAMBIO: Checkbox en color Rosa -->
                    <input id="remember-me" name="remember-me" type="checkbox"
                        class="h-4 w-4 text-pink-600 border-gray-300 rounded focus:ring-pink-500">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                        Recordarme
                    </label>
                </div>

                <!-- CAMBIO: Enlace de contraseña en color Rosa -->
                <a href="#" onclick="iniciarRecuperacion(event)" class="text-sm font-medium text-pink-600 hover:text-pink-800 transition duration-200">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <!-- Botón de Inicio de Sesión -->
            <div>
                <button type="submit"
                    class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-lg font-semibold text-white color-paragua-primary hover:bg-pink-600 transition duration-300 transform hover:scale-[1.01]">
                    <i class="ph-sign-in mr-2 text-xl"></i> Iniciar Sesión
                </button>
            </div>
        </form>

        <!-- Enlace de Registro (Opcional) -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                ¿Aún no tienes cuenta?
                <!-- CAMBIO: Enlace de registro en color Rosa -->
                <a href="index.html" class="font-medium text-pink-600 hover:text-pink-800 transition duration-200">
                    Contacta a Admisiones
                </a>
            </p>
        </div>
    </div>

    <!-- JavaScript: envío real al endpoint /api/login -->
    <script src="js/config.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                Swal.fire({
                    title: 'Campos incompletos',
                    text: 'Por favor, ingresa tu usuario y contraseña.',
                    icon: 'warning',
                    confirmButtonColor: '#EC4899'
                });
                return;
            }

            const payload = { email, password };
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
            submitBtn.innerHTML = '<i class="ph-spinner gap-2 animate-spin mr-2"></i> Iniciando...';

            try {
                const res = await fetch(`${API_BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const json = await res.json().catch(() => ({}));

                if (res.ok) {
                    console.log('Respuesta del Servidor:', json);
                    // Normalizar el rol a minúsculas
                    const rol = (json.rol || 'representante').toLowerCase();

                    // GUARDAR SESIÓN EN EL NAVEGADOR
                    localStorage.setItem('auth_token', json.token);
                    localStorage.setItem('refresh_token', json.refresh_token || '');
                    localStorage.setItem('user_rol', rol);
                    localStorage.setItem('user_email', json.user.email);
                    localStorage.setItem('user_id', json.user.id);
                    localStorage.setItem('user_estado', json.estado || 'activo');
                    
                    if (json.user.perfil_completado !== undefined) {
                        localStorage.setItem('perfil_completado', json.user.perfil_completado);
                    }

                    // ENRUTAMIENTO POR ROL
                    if ((rol === 'administrador' || rol === 'docente') && json.user.perfil_completado === false) {
                        await Swal.fire({
                            title: '¡Falta un paso!',
                            text: 'Debes completar tu perfil profesional antes de continuar.',
                            icon: 'info',
                            confirmButtonText: 'Completar perfil',
                            confirmButtonColor: '#EC4899',
                            allowOutsideClick: false,
                            customClass: { popup: 'rounded-2xl shadow-xl' }
                        });
                        window.location.href = 'completar_perfil.html';
                        return;
                    }

                    if (rol === 'administrador') {
                        await Swal.fire({
                            title: '¡Bienvenido!',
                            text: 'Inicio de sesión exitoso.',
                            icon: 'success',
                            timer: 1500,
                            timerProgressBar: true,
                            showConfirmButton: false,
                            allowOutsideClick: false,
                            background: '#ffffff',
                            color: '#374151',
                            iconColor: '#10b981',
                            customClass: { popup: 'rounded-2xl shadow-2xl' }
                        });
                        window.location.href = 'admin.html';

                    } else if (rol === 'docente') {
                        await Swal.fire({
                            title: '¡Bienvenido!',
                            text: 'Inicio de sesión exitoso.',
                            icon: 'success',
                            timer: 1500,
                            timerProgressBar: true,
                            showConfirmButton: false,
                            allowOutsideClick: false,
                            background: '#ffffff',
                            color: '#374151',
                            iconColor: '#10b981',
                            customClass: { popup: 'rounded-2xl shadow-2xl' }
                        });
                        window.location.href = 'docente.html';

                    } else {
                        // REPRESENTANTE: verificar si ya completó la ficha del estudiante
                        const fichaCompleta = json.ficha_completada; // true, false o null
                        
                        if (fichaCompleta === false) {
                            // ❌ Ficha pendiente → mostrar alerta y llevar al formulario
                            await Swal.fire({
                                title: '¡Falta un paso!',
                                html: `
                                    <p class="text-gray-600 mt-2">Antes de continuar, necesitas completar la <strong>ficha de inscripción</strong> de tu representado.</p>
                                    <p class="text-sm text-gray-400 mt-4">Este paso solo se realiza una vez.</p>
                                `,
                                icon: 'info',
                                confirmButtonText: 'Completar ficha ahora',
                                allowOutsideClick: false,
                                customClass: {
                                    popup: 'rounded-2xl shadow-xl',
                                    confirmButton: 'w-full py-3 text-white font-bold rounded-xl mt-2',
                                    title: 'text-xl font-black text-gray-800'
                                },
                                confirmButtonColor: '#EC4899'
                            });
                            window.location.href = 'form_registro_estudiante.html';
                        } else {
                            // ✅ Ficha completada (true) o sin datos (null → dejar pasar)
                            await Swal.fire({
                                title: '¡Bienvenido!',
                                text: 'Inicio de sesión exitoso.',
                                icon: 'success',
                                timer: 1500,
                                timerProgressBar: true,
                                showConfirmButton: false,
                                allowOutsideClick: false,
                                background: '#ffffff',
                                color: '#374151',
                                iconColor: '#10b981',
                                customClass: { popup: 'rounded-2xl shadow-2xl' }
                            });
                            window.location.href = 'representante.html';
                        }
                    }

                } else if (res.status === 403) {
                    Swal.fire({
                        title: 'Acceso Restringido',
                        text: json.message, // <-- Ahora usa estrictamente el mensaje del servidor
                        icon: 'warning',
                        confirmButtonColor: '#EC4899', // Cambié al rosa principal del colegio para mantener el branding
                        customClass: {
                            popup: 'rounded-2xl shadow-xl'
                        }
                    });
                } else if (res.status === 401) {
                    Swal.fire({
                        title: 'Credenciales Incorrectas',
                        text: json.message || 'Usuario o contraseña no válidos.',
                        icon: 'error',
                        confirmButtonColor: '#EC4899'
                    });
                } else if (res.status === 500) {
                    Swal.fire({
                        title: 'Error de Servidor',
                        text: json.message || 'Ocurrió un error técnico. Intente más tarde.',
                        icon: 'error',
                        confirmButtonColor: '#1f2937' // Un tono más oscuro para errores de servidor
                    });
                } else {
                    Swal.fire({
                        title: 'Error Inesperado',
                        text: json.message || 'No se pudo procesar el inicio de sesión.',
                        icon: 'error',
                        confirmButtonColor: '#EC4899'
                    });
                }
            } catch (err) {
                console.error('Error de red:', err);
                Swal.fire({
                    title: 'Error de conexión',
                    text: 'No se pudo conectar con el servidor. Intente más tarde.',
                    icon: 'error',
                    confirmButtonColor: '#EC4899'
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                submitBtn.innerHTML = '<i class="ph-sign-in mr-2 text-xl"></i> Iniciar Sesión';
            }
        });

        // ============================================
        // FLUJO DE RECUPERACIÓN DE CONTRASEÑA (Estilo Cashea)
        // ============================================
        async function iniciarRecuperacion(e) {
            e.preventDefault();

            // 1. Obtener desafío CAPTCHA del servidor
            let captchaData = null;
            try {
                Swal.fire({ title: 'Cargando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const capRes = await fetch(`${API_BASE_URL}/api/captcha`);
                captchaData = await capRes.json();
                Swal.close();
            } catch(err) {
                Swal.fire({ title: 'Error de conexión', text: 'No se pudo cargar el formulario. Intenta más tarde.', icon: 'error', confirmButtonColor: '#EC4899' });
                return;
            }

            // 2. Modal combinado: Email + Puzzle CAPTCHA
            const { value: formValues } = await Swal.fire({
                title: 'Recuperar contraseña',
                html: `
                    <div class="text-left space-y-5 mt-2">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Correo electrónico</label>
                            <input type="email" id="swal-email"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-pink-100 focus:border-pink-400 outline-none transition-all text-base"
                                placeholder="ejemplo@laparagua.edu.ve">
                        </div>
                        <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">
                                <i class="ph-bold ph-shield-check mr-1 text-pink-400"></i> Verificación de seguridad
                            </p>
                            <p class="text-xl font-black text-gray-800 mb-3">${captchaData.pregunta}</p>
                            <input type="number" id="swal-captcha"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-pink-100 focus:border-pink-400 outline-none transition-all text-base"
                                placeholder="Tu respuesta...">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Enviar enlace',
                cancelButtonText: 'Cancelar',
                focusConfirm: false,
                customClass: {
                    popup: 'rounded-[2rem] shadow-2xl p-6 sm:p-8',
                    title: 'text-2xl font-black text-left w-full text-gray-800',
                    actions: 'flex flex-col w-full gap-3 mt-6',
                    confirmButton: 'w-full py-3.5 text-white font-bold rounded-xl m-0 color-paragua-primary hover:bg-pink-600 transition-colors',
                    cancelButton: 'w-full py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl m-0 transition-colors'
                },
                buttonsStyling: false,
                preConfirm: () => {
                    const email = document.getElementById('swal-email').value.trim();
                    const respuesta = document.getElementById('swal-captcha').value.trim();
                    if (!email || !email.includes('@')) {
                        Swal.showValidationMessage('Por favor ingresa un correo válido.');
                        return false;
                    }
                    if (!respuesta) {
                        Swal.showValidationMessage('Por favor responde el desafío de seguridad.');
                        return false;
                    }
                    return { email, respuesta };
                }
            });

            if (!formValues) return; // Usuario canceló

            // 3. Enviar al backend
            Swal.fire({ title: 'Enviando enlace...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(`${API_BASE_URL}/api/recuperar-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: formValues.email,
                        captcha_id: captchaData.id,
                        captcha_respuesta: formValues.respuesta
                    })
                });

                const json = await res.json();

                if (res.ok && json.success) {
                    // ✅ Éxito
                    Swal.fire({
                        title: '¡Revisa tu bandeja!',
                        html: `
                            <div class="text-left mt-4">
                                <p class="text-gray-600 mb-4">Te enviamos a:</p>
                                <div class="bg-pink-50 border border-pink-100 rounded-xl p-4 flex items-center gap-3 overflow-hidden">
                                    <i class="ph-fill ph-envelope-simple text-2xl text-pink-500 shrink-0"></i>
                                    <span class="font-bold text-gray-800 text-base sm:text-lg truncate block w-full">${formValues.email}</span>
                                </div>
                                <p class="text-sm text-gray-400 mt-6"><i class="ph-bold ph-info"></i> Recuerda revisar la carpeta de Spam si no lo ves en unos minutos.</p>
                            </div>
                        `,
                        confirmButtonText: 'Entendido',
                        customClass: {
                            popup: 'rounded-[2rem] shadow-2xl p-6 sm:p-8',
                            title: 'text-2xl font-black text-left w-full text-gray-800',
                            confirmButton: 'w-full py-3.5 text-white font-bold rounded-xl mt-6 color-paragua-primary hover:bg-pink-600 transition-colors'
                        },
                        buttonsStyling: false
                    });
                } else {
                    // ❌ Error (captcha incorrecto, correo no existe, etc.)
                    Swal.fire({
                        title: 'Atención',
                        text: json.message || 'No se pudo procesar la solicitud.',
                        icon: 'warning',
                        confirmButtonText: 'Intentar de nuevo',
                        customClass: {
                            popup: 'rounded-[2rem] p-6',
                            confirmButton: 'w-full py-3 text-white font-bold rounded-xl mt-4 color-paragua-primary'
                        },
                        buttonsStyling: false
                    });
                }
            } catch(err) {
                Swal.fire({
                    title: 'Error de conexión',
                    text: 'No pudimos contactar al servidor. Intenta más tarde.',
                    icon: 'error',
                    confirmButtonColor: '#EC4899',
                    customClass: { popup: 'rounded-[2rem]' }
                });
            }
        }
    </script>


</body>

</html>
